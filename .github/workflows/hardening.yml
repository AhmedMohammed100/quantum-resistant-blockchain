name: Hardening Gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-installed-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build source and wheel distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "build==1.2.2.post1" "setuptools==80.9.0" "wheel==0.45.1" "packaging==26.3" "pyproject-hooks==1.3.3"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --no-isolation --sdist --wheel --outdir dist/first
          python -m build --no-isolation --sdist --wheel --outdir dist/second
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          first_wheel = next(Path("dist/first").glob("*.whl"))
          second_wheel = next(Path("dist/second").glob("*.whl"))
          first_hash = hashlib.sha256(first_wheel.read_bytes()).hexdigest()
          second_hash = hashlib.sha256(second_wheel.read_bytes()).hexdigest()
          if first_hash != second_hash:
              raise SystemExit(f"Repeated wheel builds differ: {first_hash} != {second_hash}")
          print(f"Wheel is byte-for-byte reproducible: {first_hash}")
          PY
      - name: Install wheel outside the checkout and verify migration providers
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/qbc-installed"
          python -m pip install --no-deps --target "$install_root" dist/first/*.whl
          cd "$RUNNER_TEMP"
          python - "$install_root" <<'PY'
          import importlib
          from pathlib import Path
          import sys

          install_root = Path(sys.argv[1]).resolve()
          sys.path.insert(0, str(install_root))
          import qr_blockchain

          assert Path(qr_blockchain.__file__).resolve().is_relative_to(install_root)
          for module_name in (
              "qr_chain_classical_migration_backend_rsa",
              "qr_chain_classical_migration_backend_secp256k1",
          ):
              module = importlib.import_module(module_name)
              assert Path(module.__file__).resolve().is_relative_to(install_root), module.__file__
          print("Installed wheel imports both built-in classical migration providers.")
          PY

  python-hardening:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    # CLI integration tests need an explicit non-production custody mode on Linux,
    # where no OS-backed encrypted provider is available. Never set this for deployments.
    env:
      QR_CHAIN_DEPLOYMENT_MODE: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile package
        run: python -m compileall qr_blockchain

      - name: Install coverage reporter
        run: python -m pip install coverage

      - name: Run complete regression suite with branch coverage
        run: python -W error::ResourceWarning -m coverage run --branch --source=qr_blockchain -m unittest discover -s tests -v

      - name: Report coverage for critical modules
        run: python -m coverage report --include="qr_blockchain/crypto.py,qr_blockchain/signer.py,qr_blockchain/service.py,qr_blockchain/api.py" -m

      - name: Run focused hardening suites
        run: python -W error::ResourceWarning -m unittest tests.test_config tests.test_source_ingestion tests.test_cli tests.test_adversarial tests.test_xmss_security tests.test_custody_security tests.test_rate_limit_security tests.test_crypto_verification_hardening -v

      - name: Run service safety suite
        run: python -W error::ResourceWarning -m unittest tests.test_node_service -v

      - name: Run priorities 4-7 regression suites
        run: python -W error::ResourceWarning -m unittest tests.test_protocol_fuzz tests.test_network_hardening tests.test_storage_recovery -v

      - name: Run priorities 8-12 API and property regression suites
        run: python -W error::ResourceWarning -m unittest tests.test_api_security tests.test_network_properties tests.test_rate_limit_security -v

      - name: Run priorities 13-18 HTTP transport and concurrency regressions
        run: python -W error::ResourceWarning -m unittest tests.test_http_transport_hardening -v

  portable-encoding-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22.x"
      - name: Run independent cross-language conformance suite
        working-directory: conformance/go
        run: go test -v ./...

  v2-manifest-cross-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22.x"
      - name: Run cross-runtime v2 manifest checks
        run: python -m unittest tests.test_protocol_v2_manifest_cross_runtime -v
      - name: Run isolated v2 node-to-node consensus checks
        run: python -W error::ResourceWarning -m unittest tests.test_protocol_v2_node_consensus -v
      - name: Compare Python and Go v2 consensus results
        run: python -W error::ResourceWarning -m unittest tests.test_protocol_v2_cross_runtime_consensus -v
      - name: Run v2 downgrade and mixed-version isolation tests
        run: python -W error::ResourceWarning -m unittest tests.test_protocol_v2_downgrade -v

  mldsa65-official-acvp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned liboqs-python and native runtime
        env:
          PYOQS_VERSION: "0.16.0"
        run: python -m pip install --upgrade "liboqs-python==0.16.0.2"

      - name: Download pinned official NIST ACVP vectors
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/usnistgov/ACVP-Server/a7f283cdc87d2d6dd93c1bac59e5622c5f9f8324/gen-val/json-files/ML-DSA-sigVer-FIPS204"
          mkdir -p .acvp-data/mldsa65
          curl --fail --location --retry 3 "$base/prompt.json" --output .acvp-data/mldsa65/prompt.json
          curl --fail --location --retry 3 "$base/expectedResults.json" --output .acvp-data/mldsa65/expectedResults.json

      - name: Verify official ML-DSA-65 known-answer vectors
        env:
          QBC_ACVP_DATA_DIR: .acvp-data/mldsa65
        run: python -m unittest tests.test_mldsa65_acvp_vectors -v

