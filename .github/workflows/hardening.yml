name: Hardening Gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-hardening:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile package
        run: python -m compileall qr_blockchain

      - name: Install coverage reporter
        run: python -m pip install coverage

      - name: Run complete regression suite with branch coverage
        run: python -W error::ResourceWarning -m coverage run --branch --source=qr_blockchain -m unittest discover -s tests -v

      - name: Report coverage for critical modules
        run: python -m coverage report --include="qr_blockchain/crypto.py,qr_blockchain/signer.py,qr_blockchain/service.py,qr_blockchain/api.py" -m

      - name: Run focused hardening suites
        run: python -W error::ResourceWarning -m unittest tests.test_config tests.test_source_ingestion tests.test_cli tests.test_adversarial tests.test_xmss_security tests.test_custody_security tests.test_rate_limit_security tests.test_crypto_verification_hardening -v

      - name: Run service safety suite
        run: python -W error::ResourceWarning -m unittest tests.test_node_service -v

      - name: Run priorities 4-7 regression suites
        run: python -W error::ResourceWarning -m unittest tests.test_protocol_fuzz tests.test_network_hardening tests.test_storage_recovery -v

      - name: Run priorities 8-12 API and property regression suites
        run: python -W error::ResourceWarning -m unittest tests.test_api_security tests.test_network_properties tests.test_rate_limit_security -v

      - name: Run priorities 13-18 HTTP transport and concurrency regressions
        run: python -W error::ResourceWarning -m unittest tests.test_http_transport_hardening -v

  mldsa65-official-acvp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install liboqs-python
        run: python -m pip install --upgrade "liboqs-python>=0.12.0"

      - name: Download pinned official NIST ACVP vectors
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/usnistgov/ACVP-Server/a7f283cdc87d2d6dd93c1bac59e5622c5f9f8324/gen-val/json-files/ML-DSA-sigVer-FIPS204"
          mkdir -p .acvp-data/mldsa65
          curl --fail --location --retry 3 "$base/prompt.json" --output .acvp-data/mldsa65/prompt.json
          curl --fail --location --retry 3 "$base/expectedResults.json" --output .acvp-data/mldsa65/expectedResults.json

      - name: Verify official ML-DSA-65 known-answer vectors
        env:
          QBC_ACVP_DATA_DIR: .acvp-data/mldsa65
        run: python -m unittest tests.test_mldsa65_acvp_vectors -v
