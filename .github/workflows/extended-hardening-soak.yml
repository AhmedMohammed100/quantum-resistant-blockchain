name: Extended Hardening Soak

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  bounded-multi-node-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile package
        run: python -m compileall qr_blockchain

      - name: Run deterministic protocol and networking properties
        run: python -W error::ResourceWarning -m unittest tests.test_protocol_fuzz tests.test_network_hardening tests.test_network_properties tests.test_api_security -v

      - name: Run bounded multi-node chaos scenario suite
        run: python -W error::ResourceWarning -m unittest tests.test_adversarial.AdversarialAndPropertyTests.test_load_chaos_harness_runs_all_scripted_scenarios -v

      - name: Run complete regression suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
