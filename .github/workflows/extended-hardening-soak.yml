name: Extended Hardening Soak

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  bounded-multi-node-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The regression suite exercises node services on Linux, where no OS-backed
    # encrypted wallet provider exists. Keep this workflow in explicit test mode.
    env:
      QR_CHAIN_DEPLOYMENT_MODE: test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Compile package
        run: python -m compileall qr_blockchain

      - name: Run deterministic protocol and networking properties
        run: python -W error::ResourceWarning -m unittest tests.test_protocol_fuzz tests.test_network_hardening tests.test_network_properties tests.test_api_security -v

      - name: Run bounded multi-node chaos scenario suite
        run: python -W error::ResourceWarning -m unittest tests.test_adversarial.AdversarialAndPropertyTests.test_load_chaos_harness_runs_all_scripted_scenarios -v

      - name: Run complete regression suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
