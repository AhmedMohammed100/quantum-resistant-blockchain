name: Extended Hardening Soak

on:
  workflow_dispatch:
    inputs:
      mldsa_rounds:
        description: Real ML-DSA transfers mined and synchronized by three nodes (10-499)
        required: false
        default: "60"
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/extended-hardening-soak.yml"
      - "qr_blockchain/**"
      - "tests/**"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  bounded-multi-node-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The regression suite exercises node services on Linux, where no OS-backed
    # encrypted wallet provider exists. Keep this workflow in explicit test mode.
    env:
      QR_CHAIN_DEPLOYMENT_MODE: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Compile package
        run: python -m compileall qr_blockchain

      - name: Run deterministic protocol and networking properties
        run: python -W error::ResourceWarning -m unittest tests.test_protocol_fuzz tests.test_network_hardening tests.test_network_properties tests.test_api_security -v

      - name: Run authenticated loopback peer sync checks
        run: python -W error::ResourceWarning -m unittest tests.test_authenticated_peer_loopback_sync -v

      - name: Run process-isolated peer sync and restart checks
        run: python -W error::ResourceWarning -m unittest tests.test_process_isolated_peer_sync -v

      - name: Run independent chain replay checks
        run: python -W error::ResourceWarning -m unittest tests.test_independent_chain_verifier -v

      - name: Repeat hostile network partition, latency, and recovery scenario
        shell: bash
        run: |
          set -euo pipefail
          for round in $(seq 1 5); do
            echo "Hostile network replay $round / 5"
            python -W error::ResourceWarning -m unittest \
              tests.test_process_isolated_peer_sync.ProcessIsolatedPeerSyncTests.test_peer_sync_recovers_after_partition_latency_and_dropped_block_response -v
          done
          printf 'Completed five process-isolated peer sync replays with a full partition, delayed traffic, a dropped block response, retry, and target restart recovery.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Run bounded multi-node chaos scenario suite
        run: python -W error::ResourceWarning -m unittest tests.test_adversarial.AdversarialAndPropertyTests.test_load_chaos_harness_runs_all_scripted_scenarios -v

      - name: Run ten isolated multi-node chaos replays
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/qbc-chaos-soak"
          mkdir -p "$reports"
          for round in $(seq 1 10); do
            run_dir="$reports/state-$round"
            mkdir -p "$run_dir"
            python -m qr_blockchain \
              --db-path "$run_dir/chain.db" \
              --wallet-state-db-path "$run_dir/wallet.db" \
              load-chaos \
              --scenario all \
              --node-count 3 \
              --mempool-transactions 8 \
              --migration-claims 6 \
              --verification-batch-size 8 \
              --output "$reports/round-$round.json"
          done
          python - "$reports" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          reports_dir = Path(sys.argv[1])
          rounds = []
          for report_path in sorted(reports_dir.glob("round-*.json")):
              report = json.loads(report_path.read_text(encoding="utf-8"))
              rounds.append({
                  "round": int(report_path.stem.split("-")[-1]),
                  "passed": report.get("passed") is True,
                  "scenario_count": report.get("scenario_count"),
                  "report_hash": report.get("report_hash"),
              })
          aggregate = {
              "soak_version": 1,
              "rounds_requested": 10,
              "rounds_completed": len(rounds),
              "passed": len(rounds) == 10 and all(item["passed"] for item in rounds),
              "rounds": rounds,
          }
          serialized = json.dumps(aggregate, indent=2, sort_keys=True)
          print(serialized)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Repeated bounded multi-node chaos replay\n\n")
              summary.write("Ten isolated executions of every deterministic chaos scenario; these are in-process harness rehearsals, not a live-network soak.\n\n")
              summary.write("<pre>\n" + serialized + "\n</pre>\n")
          if not aggregate["passed"]:
              raise SystemExit("One or more chaos replay rounds failed.")
      - name: Run complete regression suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  real-mldsa-multinode-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QR_CHAIN_DEPLOYMENT_MODE: test
      QR_CHAIN_MLDSA_BACKEND_MODULE: qr_chain_mldsa_backend
      QR_CHAIN_MLDSA_OQS_MECHANISM: ML-DSA-65
      PYOQS_VERSION: "0.16.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the pinned real ML-DSA runtime
        run: python -m pip install --disable-pip-version-check --requirement requirements-oqs.txt

      - name: Require the configured real ML-DSA backend
        run: python -c 'from qr_blockchain.crypto import get_signature_provider; status = get_signature_provider("mldsa65_oqs_v1").backend_status(); print(status); raise SystemExit(0 if status.get("available") is True else "Real ML-DSA backend is required")'

      - name: Run repeated transaction and three-node sync soak
        env:
          QBC_MLDSA_SOAK_ROUNDS: ${{ inputs.mldsa_rounds || '60' }}
          QBC_MLDSA_SOAK_REPORT_FILE: ${{ runner.temp }}/qbc-mldsa-multinode-soak.json
        shell: bash
        run: |
          set -euo pipefail
          rounds="$QBC_MLDSA_SOAK_ROUNDS"
          python - "$rounds" <<'PY'
          import sys

          rounds = int(sys.argv[1])
          if not 10 <= rounds <= 499:
              raise SystemExit("mldsa_rounds must be between 10 and 499")
          PY
          python -W error::ResourceWarning -m unittest \
            tests.test_process_isolated_peer_sync.ProcessIsolatedPeerSyncTests.test_real_mldsa_transaction_converges_across_three_process_nodes -v
          python - "$QBC_MLDSA_SOAK_REPORT_FILE" "$GITHUB_STEP_SUMMARY" "$rounds" <<'PY'
          import json
          from pathlib import Path
          import sys

          report_path, summary_path = map(Path, sys.argv[1:3])
          requested_rounds = int(sys.argv[3])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if (
              report.get("rounds_requested") != requested_rounds
              or report.get("transactions_mined") != requested_rounds
              or report.get("validator_syncs_completed") != 2 * requested_rounds
              or report.get("all_validators_converged") is not True
              or report.get("verifier_blocks_checked") != requested_rounds + 1
          ):
              raise SystemExit("ML-DSA soak report failed its expected-workload checks")
          serialized = json.dumps(report, indent=2, sort_keys=True)
          print(serialized)
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("## Real ML-DSA three-node soak\n\n")
              summary.write("Repeated signed transfers, mining, authenticated sync to two validators, and independent replay.\n\n")
              summary.write("<pre>\n" + serialized + "\n</pre>\n")
          PY

      - name: Upload real ML-DSA soak report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: qbc-real-mldsa-multinode-soak-${{ github.run_id }}
          path: ${{ runner.temp }}/qbc-mldsa-multinode-soak.json
          if-no-files-found: error
          retention-days: 90


