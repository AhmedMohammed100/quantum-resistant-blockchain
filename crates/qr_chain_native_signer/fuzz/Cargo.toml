[package]
name = "qr_chain_native_signer-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
qr_chain_native_signer = { path = "..", default-features = false, features = ["liboqs"] }

[[bin]]
name = "verify_native_batch"
path = "fuzz_targets/verify_native_batch.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
